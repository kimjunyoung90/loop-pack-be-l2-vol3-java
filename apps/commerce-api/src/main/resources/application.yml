server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

pg:
  base-url: http://localhost:8082
  connect-timeout: 3000
  read-timeout: 5000
  callback-url: http://localhost:8080/api/v1/payments/callback

queue:
  scheduler:
    # Thundering Herd 완화: 배치 크기를 줄이고 주기를 단축하여 피크 부하 분산
    # 변경 전: 50명/1000ms (초당 50명, 피크 50명)
    # 변경 후: 10명/200ms (초당 50명, 피크 10명)
    interval-ms: 200
    batch-size: 10
    # 입장 지연: 배치 내 유저별 주문 가능 시점을 분산
    spread-interval-ms: 20    # 유저 간 기본 간격 (0번째: 0ms, 1번째: 200ms, ...)
    jitter-max-ms: 10         # 랜덤 지터 범위 (0~100ms)
  token:
    ttl-minutes: 30
  polling:
    default-interval-seconds: 10
    tiers:
      - max-position: 100
        interval-seconds: 2
      - max-position: 500
        interval-seconds: 5

resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.RestClientException

---
spring:
  config:
    activate:
      on-profile: local, test

queue:
  scheduler:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false